name: YouTube Abyss Ultimate Automation

on:
  schedule:
    # 1. KUNLIK 4 TA SHORTS (Toshkent 18:00, 21:00, 00:00, 03:00)
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 19 * * *'
    - cron: '0 22 * * *'

    # 2. HAR KUNI 1 TA 3 MINUTLIK TO'LIQ VIDEO (Toshkent 22:30 / 17:30 UTC)
    - cron: '30 17 * * *'

    # 3. HAFTASIGA 2 TA 4 MINUTLIK QISMLI SERIAL (Chorshanba va Shanba Toshkent 23:30 / 18:30 UTC)
    - cron: '30 18 * * 3,6'

    # 4. HAFTASIGA 2 TA POST / YANGILIK (Seshanba va Juma Toshkent 20:00 / 15:00 UTC)
    - cron: '0 15 * * 2,5'

  workflow_dispatch:
    inputs:
      video_mode:
        description: 'Qaysi formatni ishga tushirmoqchisiz?'
        required: true
        default: 'long_3min'
        type: choice
        options:
          - shorts
          - long_3min
          - series_4min
          - post

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests edge-tts moviepy==1.0.3 google-genai google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow numpy

      - name: Determine Mode and Execute
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_MODE="${{ github.event.inputs.video_mode }}"
          elif [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then
            SELECTED_MODE="long_3min"
          elif [ "${{ github.event.schedule }}" = "30 18 * * 3,6" ]; then
            SELECTED_MODE="series_4min"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 2,5" ]; then
            SELECTED_MODE="post"
          else
            SELECTED_MODE="shorts"
          fi

          echo "🚀 ISHGA TUSHIRILAYOTGAN REJIM: $SELECTED_MODE"
          python run.py --mode=$SELECTED_MODE
