name: Scheduled Video Production

on:
  schedule:
    # 1. Soat 06:00 UZT (01:00 UTC) -> 2 daqiqalik asosiy video
    - cron: '0 1 * * *'
    # 2. Soat 11:00 UZT (06:00 UTC) -> Short 1
    - cron: '0 6 * * *'
    # 3. Soat 16:00 UZT (11:00 UTC) -> Short 2
    - cron: '0 11 * * *'
    # 4. Soat 20:00 UZT (15:00 UTC) -> Short 3
    - cron: '0 15 * * *'
    # 5. Soat 00:00 UZT (19:00 UTC) -> Short 4
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Nimani render qilish: main, short1, short2, short3, short4, all'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  produce-content:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyani yuklash
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 3.10 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: FFmpeg o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Belgilangan videoni render qilish
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_MODE: ${{ github.event.inputs.target }}
        run: python run.py

      - name: Tayyor videoni saqlash (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Tarixni repoga saqlash
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add history.json
          git diff --staged --quiet || git commit -m "Auto-update content plan [skip ci]"
          git push origin main
