name: YouTube Abyss Ultimate Automation

on:
  schedule:
    # --- HAR KUNI 4 TA SHORTS (AQSH EST: 08:00, 12:00, 16:00, 20:00) ---
    - cron: '0 12 * * *'   # UTC 12:00 -> EST 08:00
    - cron: '0 16 * * *'   # UTC 16:00 -> EST 12:00
    - cron: '0 20 * * *'   # UTC 20:00 -> EST 16:00
    - cron: '0 0 * * *'    # UTC 00:00 -> EST 20:00

    # --- HAR KUNI 1 TA 3-DAQIQALIK GORIZONTAL VIDEO (AQSH EST: 18:00) ---
    - cron: '0 22 * * *'   # UTC 22:00 -> EST 18:00

    # --- HAFTASIGA 2 TA SERIAL 4-MIN (Seshanba va Juma, AQSH EST: 19:00) ---
    - cron: '0 23 * * 2,5' # UTC 23:00 -> EST 19:00

    # --- HAFTASIGA 2 TA COMMUNITY POST (Chorshanba va Yakshanba, AQSH EST: 14:00) ---
    - cron: '0 18 * * 3,0' # UTC 18:00 -> EST 14:00

  workflow_dispatch:
    inputs:
      mode:
        description: 'Qaysi format ishga tushsin?'
        required: true
        default: 'shorts'
        type: choice
        options:
          - shorts
          - long_3min
          - series_4min
          - post

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 pillow moviepy==1.0.3 edge-tts requests numpy

      - name: Determine Mode and Execute
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_MODE="${{ github.event.inputs.mode }}"
          else
            HOUR=$(date -u +%H)
            DAY=$(date -u +%u)

            if [ "$HOUR" = "22" ]; then
              SELECTED_MODE="long_3min"
            elif [ "$HOUR" = "23" ] && { [ "$DAY" = "2" ] || [ "$DAY" = "5" ]; }; then
              SELECTED_MODE="series_4min"
            elif [ "$HOUR" = "18" ] && { [ "$DAY" = "3" ] || [ "$DAY" = "7" ]; }; then
              SELECTED_MODE="post"
            else
              SELECTED_MODE="shorts"
            fi
          fi

          echo "🚀 ISHGA TUSHIRILAYOTGAN REJIM: $SELECTED_MODE"
          python run.py --mode=$SELECTED_MODE

      - name: Commit & Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Auto-update video history [skip ci]" || exit 0
          git push
