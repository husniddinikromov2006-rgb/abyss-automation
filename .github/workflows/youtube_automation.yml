name: YouTube Abyss & Declassified Secrets Automation

on:
  schedule:
    # 4 TA KUNLIK SHORTS (AQSH peak vaqtlari bo'yicha)
    - cron: '0 13 * * *'   # Shorts 1: AQSH 09:00 AM (Toshkent 18:00)
    - cron: '0 17 * * *'   # Shorts 2: AQSH 01:00 PM (Toshkent 22:00)
    - cron: '0 21 * * *'   # Shorts 3: AQSH 05:00 PM (Toshkent 02:00)
    - cron: '0 1 * * *'    # Shorts 4: AQSH 09:00 PM (Toshkent 06:00)
    
    # HAR KUNI CHIQADIGAN 3 DAQIQALIK TITANLAR URUSHI VIDEOSI
    - cron: '30 18 * * *'  # Har kuni AQSH 02:30 PM (Toshkent 23:30)

  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install requests edge-tts moviepy==1.0.3 google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow numpy

      - name: Run Content Pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # Agar soat 18:30 UTC bo'lsa, 3 daqiqalik katta video yasaladi, qolgan soatlarda Shorts
          if [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            echo "🚀 Har kunlik 3 daqiqalik Mega Urush videosi yuklanmoqda..."
            python run.py long
          else
            echo "⚡ Kunlik Shorts chiqarilmoqda..."
            python run.py short
          fi

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "Auto-update history [skip ci]" || true
          git push || true
