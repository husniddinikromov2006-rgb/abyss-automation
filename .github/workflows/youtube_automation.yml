name: YouTube Abyss & Declassified Secrets Automation

on:
  schedule:
    - cron: '0 13 * * *'  # Shorts 1: 09:00 AM ET
    - cron: '0 17 * * *'  # Shorts 2: 01:00 PM ET
    - cron: '0 21 * * *'  # Shorts 3: 05:00 PM ET
    - cron: '0 1 * * *'   # Shorts 4: 09:00 PM ET
    - cron: '0 17 * * 3,0' # 3-min video: Chorshanba va Yakshanba 01:00 PM ET
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Python sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests edge-tts moviepy==1.0.3 numpy Pillow google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Videoni yasash va yuklash
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_DAY=$(date -u +%u)
          if [ "$CURRENT_HOUR" = "17" ] && ([ "$CURRENT_DAY" = "3" ] || [ "$CURRENT_DAY" = "7" ]); then
            python run.py long
          else
            python run.py short
          fi

      - name: Tarixni saqlash
        run: |
          git config --global user.name "AbyssBot"
          git config --global user.email "bot@abyss.local"
          git add history.json
          git commit -m "Auto: Update history" || echo "No changes"
          git push
